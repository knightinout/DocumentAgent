version: "3.9"

# DocumentAgent — compose stack
#
# Services:
#   api       — FastAPI teacher grading backend (port 8000)
#   streamlit — Streamlit demo UI          (port 8501)
#
# Usage:
#   docker compose up api               # API only
#   docker compose up                   # API + Streamlit
#   docker compose up --build           # rebuild images
#
# Environment:
#   Copy .env.example to .env and fill in values before running.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: documentagent-api:latest
    container_name: documentagent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Local model — points to LM Studio running on the host machine
      LM_STUDIO_BASE_URL: "${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}"
      LOCAL_MODEL_NAME: "${LOCAL_MODEL_NAME:-gemma-3-4b-instruct}"
      # Cloud backend (optional)
      VISION_AGENT_API_KEY: "${VISION_AGENT_API_KEY:-}"
      # CORS: comma-separated list of allowed origins, or * for all
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    extra_hosts:
      # Allows container to reach LM Studio on the host
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: documentagent-streamlit:latest
    container_name: documentagent-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      LM_STUDIO_BASE_URL: "${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}"
      LOCAL_MODEL_NAME: "${LOCAL_MODEL_NAME:-gemma-3-4b-instruct}"
      VISION_AGENT_API_KEY: "${VISION_AGENT_API_KEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy
