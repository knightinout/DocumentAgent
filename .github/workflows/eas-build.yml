name: EAS Build — Android

# Builds the React Native teacher grading app via Expo Application Services.
# Produces an APK artifact uploaded to GitHub Releases on tags.
#
# Prerequisites:
#   - EXPO_TOKEN secret set in repository Settings → Secrets
#   - mobile/ directory present (see feat/mobile-app PR)

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: false
        default: preview
        type: choice
        options: [preview, production]

jobs:
  eas-build:
    name: EAS Build (${{ inputs.profile || 'preview' }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build Android APK (preview)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --non-interactive \
            --platform android \
            --profile ${{ inputs.profile || 'preview' }}

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --target runtime -t documentagent-api:ci .
      - name: Basic healthcheck (smoke test)
        run: |
          docker run -d --name da-api -p 8000:8000 \
            -e LM_STUDIO_BASE_URL=http://localhost:1234/v1 \
            documentagent-api:ci
          sleep 10
          curl -f http://localhost:8000/api/v1/health || true
          docker stop da-api
